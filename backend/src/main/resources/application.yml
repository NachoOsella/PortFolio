spring:
  application:
    name: portfolio-backend
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  cors-allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  auth:
    users: ${APP_AUTH_USERS:}
    cookie-name: ${APP_AUTH_COOKIE_NAME:portfolio_session}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    session-ttl: ${APP_AUTH_SESSION_TTL:PT12H}

github:
  api-url: ${GITHUB_API_URL:https://api.github.com}
  owner: ${GITHUB_OWNER:}
  repository: ${GITHUB_REPOSITORY:}
  token: ${GITHUB_TOKEN:}
  branch: ${GITHUB_BRANCH:main}
  content-root: ${GITHUB_CONTENT_ROOT:frontend/content}
  timeout: ${GITHUB_TIMEOUT:PT15S}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
